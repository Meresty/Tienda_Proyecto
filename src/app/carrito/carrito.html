<div class="contenedor-carrito">
  <h2 class="titulo-carrito">Tu Carrito de compras</h2>
  
  <div *ngIf="cartItems.length === 0" class="carrito-vacio">
    <p>Tu carrito está vacío, compraaaaaa</p>
    <a routerLink="/catalogo" class="btn-vaciar">Ver</a>
  </div>

  <div *ngIf="cartItems.length > 0" class="carrito-contenido">
    <div class="lista-items">
      <div *ngFor="let item of cartItems" class="item-carrito">
        <img [src]="item.product.imagen" [alt]="item.product.nombre" class="img-item">
        
        <div class="info-item">
          <h4 class="nombre-item">{{ item.product.nombre }}</h4>
          <p class="descripcion-item">{{ item.product.descripcion }}</p>
          <span class="precio-unitario">${{ item.product.precio }}</span>
        </div>
        
        <div class="controles-cantidad">
          <button 
            (click)="actualizar(item, item.quantity - 1)"
            class="btn-cantidad">-</button>
          <span class="cantidad">{{ item.quantity }}</span>
          <button 
            (click)="actualizar(item, item.quantity + 1)"
            class="btn-cantidad">+</button>
        </div>
        
        <div class="precio-total">
          ${{ (item.product.precio * item.quantity).toFixed(2) }}
        </div>
        
        <button 
          (click)="quitar(item)"
          class="btn-remover">
          🗑️
        </button>
      </div>
    </div>

    <div class="acciones-carrito">
      <button (click)="vaciar()" class="btn-limpiar">Limpiar carrito</button>
      <button (click)="exportarXML()" class="btn-exportar">Exportar Factura XML</button>
      <button class="btn-comprar">Proceder al pago</button>
    </div>
  </div>
</div>
